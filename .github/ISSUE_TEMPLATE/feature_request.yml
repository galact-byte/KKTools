name: 功能建议
description: 新功能、使用体验或现有流程的改进建议
title: "[建议] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: 软件报错或已有功能失效，请改用「Bug 反馈」。这里无需提供错误日志。
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与遇到的不便
      description: 你在什么情况下需要这个功能？目前怎么处理？
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 希望怎样改进
      description: 描述你希望的操作方式和结果，可附截图或参考示例。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 补充说明（可选）
      description: 其他可接受的方案，或现有操作需要保留的地方。
