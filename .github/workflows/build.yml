name: Build KKTools

on:
  push:
    branches: [master]
    tags:
      - 'v*'
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Write build metadata
        shell: python
        run: |
          import json, os
          from pathlib import Path
          Path("core/build_info.json").write_text(json.dumps({
              "version": os.environ["GITHUB_REF_NAME"],
              "commit": os.environ["GITHUB_SHA"],
          }), encoding="utf-8")

      - name: Check release notes (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $notes = "RELEASE_NOTES.md"
          if (!(Test-Path $notes) -or !(Get-Content $notes -Raw).Trim()) {
            throw "请先编写本次版本的发布说明：$notes"
          }

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name KKTools `
            --add-data "ui/themes;ui/themes" `
            --add-data "ui/icons;ui/icons" `
            --add-data "ui/style.qss.tmpl;ui" `
            --add-data "core/build_info.json;core" `
            --clean `
            main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KKTools-windows
          path: dist/KKTools.exe

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/KKTools.exe
          body_path: RELEASE_NOTES.md
